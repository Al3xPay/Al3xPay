name: Telegram status

on:
  schedule:
    - cron: '*/1 * * * *'   # каждую минуту
  workflow_dispatch:          # кнопка «Run» вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install telethon

      - name: Check Telegram status
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python check_status.py

      - name: Commit tg-status.json
        run: |
          git config user.name "tg-status-bot"
          git config user.email "action@github.com"
          git add output/portfolio/tg-status.json
          git diff --cached --quiet || (git commit -m "status update [skip ci]" && git push)
